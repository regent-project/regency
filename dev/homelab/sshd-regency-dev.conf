# regency dev (dev/run_homelab): sshd of the machine holding the dataset's
# managed hosts. The homelab's runner opens one SSH connection per job, many
# at once (16 assessments in parallel by default), all from one address.
# Install it once, with the homelab's address in place of HOMELAB_ADDRESS:
#   sudo install -m 0644 dev/homelab/sshd-regency-dev.conf /etc/ssh/sshd_config.d/50-regency-dev.conf
#   sudo sed -i 's/HOMELAB_ADDRESS/192.168.1.40/' /etc/ssh/sshd_config.d/50-regency-dev.conf
#   sudo systemctl enable --now sshd    (or: sudo systemctl reload sshd)

# default 10:30:100 drops connections beyond 10 unauthenticated ones
MaxStartups 100:30:200
# OpenSSH 9.8+ penalizes an address that opens many connections; not the homelab
PerSourcePenaltyExemptList HOMELAB_ADDRESS
