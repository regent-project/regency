# Every push and pull request: format, lints, unit and integration tests
# (RabbitMQ and CouchDB containers through testcontainers), the web client
# (WASM) and the Windows build (D22).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude frontend --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: unit and integration tests (docker)
        run: cargo test --workspace --exclude frontend --locked -- --include-ignored

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
      - run: cargo clippy -p frontend --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test -p frontend --locked
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.22.1
      - run: trunk build --release
        working-directory: frontend

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: build (D22)
        run: cargo build --locked -p scheduler -p runner -p dbwriter -p backend -p endpoint -p sourcesync -p regencyctl
      - name: unit tests
        run: cargo test --locked -p regencylib --lib

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: all-in-one image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: aio
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  book:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.52"
      - run: mdbook build book
