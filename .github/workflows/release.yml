# Release (D20): one version for the whole of regency. Pushing the tag
# v<version> (e.g. v0.2.0) checks the release (.github/scripts/release-check.sh:
# workspace version, CHANGELOG.md section with one subsection per component),
# builds every binary and the web client, and publishes a GitHub release whose
# notes are that CHANGELOG.md section, with the assets:
#   - one .deb and one .rpm per component (amd64): regency-scheduler,
#     regency-runner, regency-dbwriter, regency-backend, regency-endpoint,
#     regency-sourcesync, regencyctl, regency-frontend;
#   - regency-all-in-one (.deb and .rpm): everything on one host;
#   - install.sh (the one-line installer of the all-in-one) and SHA256SUMS.
# OCI images and the Helm chart are not released yet.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # the packages declare the glibc their binaries need (printed below),
    # usually older than the runner's (2.43)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: check the release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          .github/scripts/release-check.sh "$version" "$RUNNER_TEMP/notes.md"

      - uses: ./.github/actions/setup
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.22.1
      - name: packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: build the binaries
        run: cargo build --release --locked
      - name: glibc needed by the binaries
        run: |
          for b in regency-aio regency-scheduler regency-runner regency-dbwriter regency-backend regency-endpoint regency-sourcesync regencyctl; do
            echo "$b: $(objdump -T "target/release/$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          done
      - name: build the web client
        working-directory: frontend
        run: trunk build --release

      - name: packages
        run: |
          set -euo pipefail
          mkdir -p dist
          for crate in scheduler runner dbwriter backend endpoint sourcesync regencyctl frontend regency-aio; do
            cargo deb --no-build -p "$crate" -o dist/
            cargo generate-rpm -p "$crate" -o dist/
          done
          ls -l dist
          # exactly one deb and one rpm per component
          test "$(ls dist/*.deb | wc -l)" = 9
          test "$(ls dist/*.rpm | wc -l)" = 9
          # the one-line installer (releases/latest/download/install.sh) and
          # the checksums it verifies
          cp install.sh dist/
          (cd dist && sha256sum *.deb *.rpm install.sh > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          name: regency v${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: dist/*
