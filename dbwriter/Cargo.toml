[package]
name = "dbwriter"
description = "regency's only CouchDB writer: outcomes, job lifecycle, commands, retention"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "regency-dbwriter"
path = "src/main.rs"

[dependencies]
regencylib = { workspace = true }
regent-sdk = { workspace = true }
lapin = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
prometheus = { workspace = true }

[dev-dependencies]
regencylib = { workspace = true, features = ["testing"] }

# Packages (D15, D20: one version, released with tag v<version>): cargo deb -p dbwriter / cargo generate-rpm -p dbwriter
[package.metadata.deb]
name = "regency-dbwriter"
maintainer = "Romain SUZANNE <romzorus591@gmail.com>"
copyright = "2026, Romain SUZANNE"
license-file = ["../LICENSE", "0"]
extended-description = "regency dbwriter: records outcomes, jobs and commands in CouchDB."
depends = "$auto, systemd, adduser"
section = "admin"
priority = "optional"
maintainer-scripts = "../packaging/debian/"
conf-files = ["/etc/regency/dbwriter.toml"]
assets = [
    ["target/release/regency-dbwriter", "usr/bin/", "755"],
    ["../packaging/systemd/regency-dbwriter.service", "lib/systemd/system/", "644"],
    ["../packaging/config/dbwriter.toml", "etc/regency/", "640"],
    ["../CHANGELOG.md", "usr/share/doc/regency-dbwriter/", "644"],
]

[package.metadata.generate-rpm]
name = "regency-dbwriter"
summary = "regency dbwriter: records outcomes, jobs and commands in CouchDB"
release = "1"
assets = [
    { source = "target/release/regency-dbwriter", dest = "/usr/bin/regency-dbwriter", mode = "755" },
    { source = "../packaging/systemd/regency-dbwriter.service", dest = "/usr/lib/systemd/system/regency-dbwriter.service", mode = "644" },
    { source = "../packaging/config/dbwriter.toml", dest = "/etc/regency/dbwriter.toml", mode = "640", config = "noreplace" },
    { source = "../CHANGELOG.md", dest = "/usr/share/doc/regency-dbwriter/CHANGELOG.md", mode = "644", doc = true },
]
post_install_script = "../packaging/rpm/dbwriter/postinst"
pre_uninstall_script = "../packaging/rpm/dbwriter/preun"
post_uninstall_script = "../packaging/rpm/dbwriter/postun"

[package.metadata.generate-rpm.requires]
systemd = "*"
