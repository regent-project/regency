{{- if not .Values.existingSecret }}
{{- $name := printf "%s-secrets" (include "regency.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "regency.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $svc := list "scheduler" "runner" "dbwriter" "backend" "endpoint" "sourcesync" }}
  {{ $svc }}.rabbitmq: {{ include "regency.keep" (list $existing (printf "%s.rabbitmq" $svc)) }}
  {{ $svc }}.couchdb: {{ include "regency.keep" (list $existing (printf "%s.couchdb" $svc)) }}
  {{- end }}
  session-key: {{ include "regency.keep" (list $existing "session-key") }}
  enrollment-key: {{ include "regency.keep" (list $existing "enrollment-key") }}
  rabbitmq-admin: {{ include "regency.keep" (list $existing "rabbitmq-admin") }}
  couchdb-admin: {{ include "regency.keep" (list $existing "couchdb-admin") }}
  erlang-cookie: {{ include "regency.keep" (list $existing "erlang-cookie") }}
  couchdb-cookie: {{ include "regency.keep" (list $existing "couchdb-cookie") }}
  {{- if .Values.adminPassword }}
  bootstrap-admin: {{ .Values.adminPassword | b64enc }}
  {{- else }}
  bootstrap-admin: {{ include "regency.keep" (list $existing "bootstrap-admin") }}
  {{- end }}
{{- end }}
---
{{- if not (or .Values.services.endpoint.tlsSecret .Values.services.endpoint.caSecret) }}
{{- $name := printf "%s-endpoint-tls" (include "regency.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "regency.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- if $existing }}
  {{- toYaml $existing.data | nindent 2 }}
{{- else }}
  {{- $ca := genCA "regency built-in CA" 3650 }}
  {{- $host := printf "%s-endpoint" (include "regency.fullname" .) }}
  {{- $cert := genSignedCert $host nil (list $host (printf "%s.%s.svc" $host .Release.Namespace) (printf "%s.%s.svc.cluster.local" $host .Release.Namespace)) 825 $ca }}
  ca.pem: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
  endpoint.pem: {{ $cert.Cert | b64enc }}
  endpoint.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
