{{- $root := . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "regency.fullname" . }}-config
  labels: {{- include "regency.labels" . | nindent 4 }}
data:
  {{- range $svc := list "scheduler" "runner" "dbwriter" "backend" "endpoint" "sourcesync" }}
  {{ $svc }}.toml: |
    # generated by the regency Helm chart; per-instance keys come from env
    [security]
    internal = {{ $root.Values.security.internal }}
    external = {{ $root.Values.security.external }}

    [rabbitmq]
    url = {{ include "regency.rabbitmqUrl" $root | quote }}
    stream_host = {{ include "regency.streamHost" $root | quote }}
    stream_port = {{ include "regency.streamPort" $root }}
    username = "regency-{{ $svc }}"
    password = { SecRef = "/etc/regency/secrets/{{ $svc }}.rabbitmq" }

    [couchdb]
    url = {{ include "regency.couchdbUrl" $root | quote }}
    username = "regency-{{ $svc }}"
    password = { SecRef = "/etc/regency/secrets/{{ $svc }}.couchdb" }

    [health]
    listen = "0.0.0.0:9090"

    [log]
    format = "json"
    {{- if eq $svc "backend" }}

    [backend]
    listen = "0.0.0.0:8080"
    session_key = { SecRef = "/etc/regency/secrets/session-key" }
    bootstrap_admin = "admin"
    enrollment_key = { SecRef = "/etc/regency/secrets/enrollment-key" }
    frontend_dir = "/usr/share/regency/web"
    {{- if $root.Values.ingress.tlsSecret }}
    tls_offloaded = true
    {{- end }}
    {{- end }}
    {{- if eq $svc "endpoint" }}

    [endpoint]
    listen = "0.0.0.0:8443"
    cert = "/etc/regency/tls/endpoint.pem"
    key = { SecRef = "/etc/regency/tls/endpoint.key" }

    [ca]
    cert = "/etc/regency/tls/ca.pem"
    key = { SecRef = "/etc/regency/tls/ca.key" }
    enrollment_key = { SecRef = "/etc/regency/secrets/enrollment-key" }
    {{- end }}
    {{- if eq $svc "runner" }}

    [runner]
    pool = {{ $root.Values.services.runner.pool | quote }}
    {{- end }}
    {{- if eq $svc "sourcesync" }}

    [sourcesync]
    workdir = "/var/lib/regency/sourcesync"
    {{- end }}
  {{- end }}
  regencyctl.toml: |
    rabbitmq_management_url = {{ include "regency.managementUrl" . | quote }}
    pools = [{{ .Values.services.runner.pool | quote }}]

    [security]
    internal = {{ .Values.security.internal }}

    [rabbitmq]
    url = {{ include "regency.rabbitmqUrl" . | quote }}
    username = {{ if .Values.rabbitmq.enabled }}"admin"{{ else }}{{ .Values.rabbitmq.external.adminUser | quote }}{{ end }}
    password = { SecRef = "/etc/regency/secrets/rabbitmq-admin" }

    [couchdb]
    url = {{ include "regency.couchdbUrl" . | quote }}
    username = {{ if .Values.couchdb.enabled }}"admin"{{ else }}{{ .Values.couchdb.external.adminUser | quote }}{{ end }}
    password = { SecRef = "/etc/regency/secrets/couchdb-admin" }

    [log]
    format = "json"

    [bootstrap]
    name = "admin"
    password = { SecRef = "/etc/regency/secrets/bootstrap-admin" }
    {{- range $svc := list "scheduler" "runner" "dbwriter" "backend" "endpoint" "sourcesync" }}

    [accounts.{{ $svc }}]
    rabbitmq_password = { SecRef = "/etc/regency/secrets/{{ $svc }}.rabbitmq" }
    couchdb_password = { SecRef = "/etc/regency/secrets/{{ $svc }}.couchdb" }
    {{- end }}
