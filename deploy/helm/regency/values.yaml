# regency Helm chart. Every service is a Deployment (stateless, replicated:
# no single point of failure); RabbitMQ and CouchDB are bundled as 3-node
# clusters (rabbitmq.enabled / couchdb.enabled) or external.

image:
  registry: ghcr.io/regent-project
  pullPolicy: IfNotPresent
imagePullSecrets: []

# D19 security levels of every service; an external level can also be set
# from the web UI (central configuration, D21) unless set here.
security:
  internal: 1
  external: 1

# One block per service; `env` adds REGENCY_<SECTION>_<KEY> variables (D15),
# which win over everything else (the key then shows as pinned in the UI).
services:
  scheduler:
    replicas: 2
    tag: "0.3.1"
    resources: {}
    env: {}
  runner:
    replicas: 2
    tag: "0.3.1"
    pool: default
    resources: {}
    env: {}
    # secret holding the credentials of managed hosts (SSH keys...), mounted
    # in /etc/regency/host-secrets (D9: tasks carry references only)
    hostSecrets: ""
  dbwriter:
    replicas: 2
    tag: "0.3.1"
    resources: {}
    env: {}
  backend:
    replicas: 2
    tag: "0.3.1"
    resources: {}
    env: {}
    service:
      type: ClusterIP
      port: 8080
  endpoint:
    replicas: 2
    tag: "0.3.1"
    resources: {}
    env: {}
    # TLS secret (tls.crt/tls.key) of the endpoint's server certificate;
    # empty = generated by the chart (self-signed by the built-in CA)
    tlsSecret: ""
    # built-in CA (D13) enrollment: CA generated by the chart when empty
    caSecret: ""
    service:
      type: LoadBalancer
      port: 8443
  sourcesync:
    replicas: 2
    tag: "0.3.1"
    resources: {}
    env: {}

regencyctl:
  tag: "0.3.1"

# Web UI + API (gRPC-Web) through an ingress to backend (which serves the web
# client on the same port).
ingress:
  enabled: false
  className: ""
  host: regency.example.com
  annotations: {}
  # tls secret name; empty = no TLS on the ingress
  tlsSecret: ""

# Initial password of the bootstrap admin `admin` (D12); empty = generated
# (kubectl get secret <release>-regency-secrets -o jsonpath='{.data.bootstrap-admin}' | base64 -d)
adminPassword: ""

# Existing secret with every key of templates/secrets.yaml instead of the
# generated one.
existingSecret: ""

rabbitmq:
  enabled: true
  image: rabbitmq:4.1-management
  replicas: 3
  storage: 8Gi
  storageClass: ""
  resources: {}
  # external broker when enabled = false
  external:
    url: amqp://rabbitmq.example.internal:5672
    streamHost: rabbitmq.example.internal
    streamPort: 5552
    managementUrl: http://rabbitmq.example.internal:15672
    adminUser: admin

couchdb:
  enabled: true
  image: couchdb:3.5
  replicas: 3
  storage: 8Gi
  storageClass: ""
  resources: {}
  external:
    url: http://couchdb.example.internal:5984
    adminUser: admin
