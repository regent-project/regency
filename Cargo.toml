[workspace]
resolver = "3"
members = [
    "backend",
    "dbwriter",
    "endpoint",
    "frontend",
    "regencylib",
    "runner",
    "scheduler",
    "sourcesync",
    "regencyctl",
    "regency-aio",
]
# The frontend is WASM only (built with trunk, see frontend/README.md).
default-members = [
    "backend",
    "dbwriter",
    "endpoint",
    "regencylib",
    "runner",
    "scheduler",
    "sourcesync",
    "regencyctl",
    "regency-aio",
]

[workspace.package]
# One version for every crate and package: a release is the tag v<version> (RELEASING.md)
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/regent-project/regency"

[workspace.dependencies]
# Exact pin: the serde layout of SDK types is version-dependent (D2).
# `proto`: outcomes travel as regent-sdk's protobuf messages (D6); needs protoc 36.1.
# Members needing the gRPC Reporting service (endpoint) add `features = ["grpc"]`.
regent-sdk = { version = "=0.23.0", features = ["proto"] }
regencylib = { path = "regencylib" }

# Google protobuf v4 runtime, same exact version as regent-sdk's (D6).
protobuf = "=4.36.1-release"
protobuf-codegen = "=4.36.1-release"
tonic = { version = "0.14", default-features = false }
tonic-build = "0.14"
tonic-web = "0.14"

tokio = { version = "1.54", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"
toml = "1.2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter", "registry"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.17"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
lapin = "4.12"
rabbitmq-stream-client = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query"] }
axum = "0.8"
prometheus = "0.14"
cedar-policy = "4.14"
argon2 = "0.5"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto", "pem", "x509-parser"] }
x509-parser = "0.18"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-pemfile = "2"
testcontainers = "0.28"
url = "2"

[profile.release]
lto = true
